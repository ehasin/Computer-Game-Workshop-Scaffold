<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Game Studio Workshop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <h1 id="title">Game Studio Workshop 🎮</h1>
    <canvas id="game"></canvas>
    <div id="touch-controls">
      <button id="btn-left" aria-label="left">◀</button>
      <button id="btn-right" aria-label="right">▶</button>
    </div>
    <p id="hint">Arrow keys / A-D / drag on mobile to move the block. This is just the starter — build the real game on top of it!</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
